<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SwasthAI Doctor Portal</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  body{font-family:'Inter',system-ui,sans-serif}
  #vim{transition:transform .15s ease;transform-origin:center;background:#fff;max-width:100%}
  :focus-visible{outline:2px solid #2dd4bf;outline-offset:2px}
</style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-16">

<nav class="bg-slate-950 border-b border-slate-800 px-5 py-3.5 sticky top-0 z-50">
  <div class="max-w-6xl mx-auto flex items-center justify-between gap-3 flex-wrap">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-xl bg-teal-500 text-slate-950 grid place-items-center font-extrabold">S</div>
      <span class="text-lg font-extrabold tracking-tight">Swasth<span class="text-teal-400">AI</span></span>
      <span class="text-[11px] text-teal-400 font-bold bg-teal-950 border border-teal-800 px-2 py-0.5 rounded-full uppercase tracking-wider">Doctor Portal</span>
    </div>
    <div class="flex items-center gap-4 text-xs font-semibold text-slate-400">
      <span id="timer" class="hidden"></span>
      <span class="flex items-center gap-2"><span id="dot" class="w-2.5 h-2.5 rounded-full bg-slate-500"></span><span id="status">Backend: not contacted yet</span></span>
    </div>
  </div>
</nav>

<main id="app" class="max-w-5xl mx-auto px-4 pt-8"></main>
<div id="toast" class="hidden fixed left-1/2 -translate-x-1/2 bottom-6 z-50 bg-slate-100 text-slate-900 text-sm font-semibold px-5 py-3 rounded-xl shadow-xl"></div>

<script>
/* ---------- config ---------- */
const API_BASE = 'https://swasthai-backend-s7md.onrender.com/api/doctor';
const ORIGIN = new URL(API_BASE).origin;
const SESSION_MIN = 45;

/* ---------- state ---------- */
let S = null, tab = 'overview', sel = null, z = 1, rot = 0, local = [], issued = [], rows = [blank()], endAt = 0, tick = null, ack = false;
function blank(){ return { n:'', dose:'1 tablet', t:'After Breakfast', ins:'' }; }
const TIMES = ['After Breakfast','Before Breakfast','Before Lunch','After Lunch','Before Dinner','After Dinner','Before Sleep'];

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const card = 'bg-slate-950 border border-slate-800 rounded-2xl p-5';
const inp = 'w-full px-3.5 py-2.5 bg-slate-900 border border-slate-800 rounded-xl text-sm text-white placeholder-slate-600 focus:outline-none focus:border-teal-500';
const lbl = 'block text-xs font-semibold text-slate-400 uppercase tracking-wide mb-1';
const btn = 'bg-teal-500 hover:bg-teal-400 text-slate-950 font-bold rounded-xl px-5 py-2.5 text-sm transition disabled:opacity-60';
const btn2 = 'bg-slate-900 hover:bg-slate-800 text-slate-300 border border-slate-700 font-semibold rounded-lg px-3 py-1.5 text-xs transition';
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.remove('hidden'); clearTimeout(toast.h); toast.h=setTimeout(()=>t.classList.add('hidden'),3500); }
function setStatus(kind){
  const m={ok:['bg-emerald-500','Backend: online'],wait:['bg-amber-400 animate-pulse','Backend: connecting...'],bad:['bg-rose-500','Backend: unreachable']}[kind];
  $('#dot').className='w-2.5 h-2.5 rounded-full '+m[0]; $('#status').textContent=m[1];
}
function list(v){ return Array.isArray(v) ? v : (v ? String(v).split(',').map(x=>x.trim()).filter(Boolean) : []); }
function fileOf(r){ const u = r.fileUrl || r.url || r.file || r.attachment || ''; if(!u) return null;
  const full = /^(https?:|data:|blob:)/i.test(u) ? u : ORIGIN + (u.startsWith('/') ? '' : '/') + u;
  const pdf = /pdf/i.test(r.type||r.mimeType||'') || /\.pdf($|\?)/i.test(u) || /^data:application\/pdf/i.test(u);
  return { url: full, pdf }; }

/* ---------- screens ---------- */
function render(){ S ? renderDash() : renderVerify(); }

function renderVerify(msg){
  $('#timer').classList.add('hidden'); clearInterval(tick);
  $('#app').innerHTML = `
  <div class="max-w-md mx-auto ${card} p-8 space-y-6 shadow-2xl">
    <div class="text-center space-y-2">
      <div class="w-14 h-14 rounded-2xl bg-teal-500/10 border border-teal-500/30 text-teal-400 grid place-items-center mx-auto text-xl font-bold">&#9877;</div>
      <h2 class="text-2xl font-extrabold">Patient record access</h2>
      <p class="text-xs text-slate-400">Enter the 6-digit code shown in the patient's SwasthAI app to open their medical record and issue prescriptions.</p>
    </div>
    <div id="alertBox" role="alert" class="${msg?'':'hidden'} text-xs p-3 rounded-xl font-semibold text-center bg-rose-950 text-rose-300 border border-rose-800">${esc(msg)}</div>
    <form onsubmit="verify(event)" class="space-y-4">
      <div>
        <label for="otp" class="${lbl}">Patient access code</label>
        <input id="otp" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="000000" required
          class="w-full px-4 py-3.5 bg-slate-900 border border-slate-800 rounded-xl text-center text-2xl font-extrabold text-amber-400 tracking-[.4em] focus:outline-none focus:border-teal-500">
        <span class="text-[11px] text-slate-500 block text-center mt-2">Test codes on this server: <code class="text-teal-400">482731</code>, <code class="text-teal-400">492810</code></span>
      </div>
      <button id="vbtn" class="${btn} w-full py-3.5 uppercase tracking-wider">Verify and open record</button>
    </form>
  </div>`;
  $('#otp').focus();
}

async function verify(e){
  e.preventDefault();
  const otp = $('#otp').value.trim(), b = $('#vbtn'), box = $('#alertBox');
  if(!/^\d{6}$/.test(otp)){ box.textContent='Enter all 6 digits.'; box.classList.remove('hidden'); return; }
  box.classList.add('hidden'); b.disabled = true; b.textContent = 'Verifying...'; setStatus('wait');
  const slow = setTimeout(()=>{ b.textContent='Waking the server, this can take up to a minute...'; }, 6000);
  const ctl = new AbortController(), to = setTimeout(()=>ctl.abort(), 70000);
  try{
    const r = await fetch(`${API_BASE}/verify-otp`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ otp }), signal:ctl.signal });
    const d = await r.json(); setStatus('ok');
    if(d.success && d.sharedData){
      S = d.sharedData; S.patient = S.patient || {}; S.medicines = S.medicines || []; S.records = S.records || [];
      tab='overview'; sel=null; local=[]; issued=[]; rows=[blank()]; ack=false; endAt = Date.now()+SESSION_MIN*60000;
      clearInterval(tick); tick=setInterval(clock,1000); clock(); render(); scrollTo(0,0); return;
    }
    box.textContent = d.error || 'Code not valid or expired. Ask the patient for a new code.'; box.classList.remove('hidden');
  }catch(err){
    setStatus('bad'); box.textContent = 'Could not reach the backend. Check your connection and try again.'; box.classList.remove('hidden');
  }finally{ clearTimeout(slow); clearTimeout(to); b.disabled=false; b.textContent='Verify and open record'; }
}

function clock(){
  const s = Math.max(0, Math.round((endAt-Date.now())/1000)), t = $('#timer');
  t.classList.remove('hidden'); t.innerHTML = `Session <span class="${s<300?'text-rose-400':'text-slate-100'} tabular-nums">${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}</span>`;
  if(s<=0) endSession('Session expired. Ask the patient for a new code.');
}
function endSession(msg){ S=null; clearInterval(tick); renderVerify(msg); }

function renderDash(){
  const p = S.patient, al = list(p.allergies), cond = list(p.conditions);
  const tabs = [['overview','Summary'],['records',`Reports (${S.records.length+local.length})`],['rx','Write prescription'],['issued',`Issued this session (${issued.length})`]];
  $('#app').innerHTML = `
  <div class="space-y-5">
    <div class="${card} flex flex-col md:flex-row md:items-center justify-between gap-4">
      <div class="flex items-center gap-4">
        <div class="w-14 h-14 rounded-2xl bg-teal-500 text-slate-950 grid place-items-center font-extrabold text-xl">${esc((p.name||'?').split(' ').map(w=>w[0]).join('').slice(0,2))}</div>
        <div>
          <div class="flex items-center gap-2 flex-wrap"><h1 class="text-2xl font-extrabold">${esc(p.name||'Patient')}</h1>
            <span class="bg-emerald-500/15 text-emerald-400 text-[11px] font-bold px-2.5 py-1 rounded-full border border-emerald-500/30">Authorised access</span></div>
          <p class="text-xs text-slate-400 mt-1">${esc(p.age||'-')} yrs, ${esc(p.gender||'-')}, blood group <strong class="text-rose-400">${esc(p.bloodGroup||'-')}</strong></p>
        </div>
      </div>
      <button onclick="endSession('Session ended. Enter a code to open another record.')" class="${btn2} self-start md:self-auto">End session</button>
    </div>
    ${al.length?`<div class="bg-rose-950/60 border border-rose-800 text-rose-200 rounded-2xl px-5 py-3 text-sm font-semibold">Allergy alert: ${al.map(esc).join(', ')}</div>`:''}
    <div class="flex gap-1 border-b border-slate-800 overflow-x-auto" role="tablist">
      ${tabs.map(t=>`<button role="tab" aria-selected="${tab===t[0]}" onclick="go('${t[0]}')" class="px-4 py-2.5 text-sm font-semibold whitespace-nowrap border-b-2 ${tab===t[0]?'border-teal-400 text-teal-300':'border-transparent text-slate-400 hover:text-slate-200'}">${t[1]}</button>`).join('')}
    </div>
    <div id="pane"></div>
  </div>`;
  ({overview:paneOverview,records:paneRecords,rx:paneRx,issued:paneIssued})[tab]();
}
function go(t){ tab=t; renderDash(); }

function medRow(m, fresh){
  return `<div class="p-4 bg-slate-900 rounded-xl border ${fresh?'border-teal-500/50':'border-slate-800'} flex justify-between items-center gap-3">
    <div><span class="font-semibold text-white block">${esc(m.name)}</span><span class="text-xs text-slate-400">${esc(m.dosage)}, ${esc(m.timing)}${m.instructions?' ('+esc(m.instructions)+')':''}</span></div>
    <span class="${fresh?'bg-teal-500 text-slate-950':'bg-teal-950 text-teal-400 border border-teal-800'} text-[10px] font-bold px-2.5 py-1 rounded-full whitespace-nowrap">${fresh?'New':'Prescribed'}</span></div>`;
}
function paneOverview(){
  $('#pane').innerHTML = `
  <div class="space-y-5">
    <div class="bg-gradient-to-r from-slate-950 to-teal-950/40 border border-teal-900/60 rounded-2xl p-5">
      <div class="text-teal-400 font-bold text-xs uppercase tracking-wider mb-2">AI clinical summary</div>
      <p class="text-sm leading-relaxed text-slate-200">${esc(S.aiSummary || 'No summary available for this patient.')}</p>
      <p class="text-[11px] text-slate-500 mt-2">Generated automatically. Confirm against the patient's records before acting on it.</p>
    </div>
    <div class="${card}"><h3 class="font-bold mb-3">Active medicines</h3><div class="space-y-2">
      ${S.medicines.length ? S.medicines.map(m=>medRow(m)).join('') : '<p class="text-sm text-slate-500">No active medicines on record.</p>'}</div></div>
  </div>`;
}

/* ----- reports with inline viewer ----- */
function paneRecords(){
  const all = S.records.concat(local);
  $('#pane').innerHTML = `
  <div class="grid lg:grid-cols-[300px_1fr] gap-4 items-start">
    <div class="${card}"><h3 class="font-bold mb-3">Visits and reports</h3>
      <ul class="divide-y divide-slate-800">
      ${all.length ? all.map((r,i)=>{ const f=fileOf(r); return `<li><button onclick="openRec(${i})" class="w-full text-left py-3 px-2 rounded-lg flex gap-3 items-center hover:bg-slate-900 ${sel===i?'bg-slate-900':''}" aria-current="${sel===i}">
        <span class="shrink-0 w-10 h-10 rounded-lg grid place-items-center text-[10px] font-bold ${f?(f.pdf?'bg-rose-950 text-rose-300':'bg-emerald-950 text-emerald-300'):'bg-slate-800 text-slate-300'}">${f?(f.pdf?'PDF':'IMG'):'NOTE'}</span>
        <span class="min-w-0"><span class="block font-semibold text-sm truncate">${esc(r.title)}</span><span class="block text-xs text-slate-400">${esc(r.date)}</span></span></button></li>`; }).join('') : '<li class="py-3 text-sm text-slate-500">No reports on record.</li>'}
      </ul>
      <div class="mt-4 pt-4 border-t border-slate-800"><label for="lf" class="${lbl}">Open a file from this computer</label>
        <input id="lf" type="file" accept="application/pdf,image/*" onchange="localFile(this)" class="text-xs text-slate-400 w-full"></div>
    </div>
    <div id="vw" class="bg-slate-950 border border-slate-800 rounded-2xl overflow-hidden flex flex-col min-h-[540px]"></div>
  </div>`;
  drawViewer(all);
}
function openRec(i){ sel=i; z=1; rot=0; paneRecords(); if(innerWidth<1024) $('#vw').scrollIntoView(); }
function localFile(el){
  const f = el.files[0]; if(!f) return;
  const pdf = f.type === 'application/pdf'; if(!pdf && !f.type.startsWith('image/')){ toast('Only PDF or image files can be opened.'); return; }
  local.push({ title:f.name, date:'Opened now', url:URL.createObjectURL(f), type:pdf?'pdf':'image' });
  sel = S.records.length + local.length - 1; z=1; rot=0; paneRecords();
}
function drawViewer(all){
  const v = $('#vw'), r = all[sel];
  if(!r){ v.innerHTML = '<div class="m-auto text-center text-slate-500 p-8 text-sm">Select a report to read it here.<br>Files open in this viewer without downloading.</div>'; return; }
  const f = fileOf(r);
  const bar = `<div class="flex items-center gap-2 flex-wrap px-4 py-2.5 bg-slate-900 border-b border-slate-800"><span class="flex-1 font-semibold text-sm min-w-[140px] truncate">${esc(r.title)}</span>`;
  if(!f){
    v.innerHTML = bar + `</div><div class="p-6 space-y-2"><div class="text-xs text-slate-400 font-mono">${esc(r.date)}</div><p class="text-sm leading-relaxed text-slate-200 whitespace-pre-wrap">${esc(r.details || 'No details recorded.')}</p></div>`; return;
  }
  v.innerHTML = bar +
    (f.pdf ? '' : `<button class="${btn2}" onclick="zoom(-.25)" aria-label="Zoom out">&minus;</button><button class="${btn2}" onclick="zoom(.25)" aria-label="Zoom in">+</button><button class="${btn2}" onclick="turn()">Rotate</button><button class="${btn2}" onclick="zoom(0)">Fit</button>`) +
    `<button class="${btn2}" onclick="window.open('${esc(f.url)}','_blank','noopener')">Open in new tab</button><button class="${btn2}" onclick="document.getElementById('vw').requestFullscreen?.()">Full screen</button></div>
    <div class="flex-1 overflow-auto grid place-items-center p-3 bg-slate-800/60 min-h-[480px]">
      ${f.pdf ? `<iframe title="${esc(r.title)}" src="${esc(f.url)}#toolbar=0&navpanes=0&view=FitH" class="w-full h-full min-h-[500px] bg-white border-0 self-stretch"></iframe>`
              : `<img id="vim" alt="${esc(r.title)}" src="${esc(f.url)}">`}
    </div>
    ${r.details ? `<div class="px-4 py-2 text-xs text-slate-400 border-t border-slate-800">${esc(r.details)}</div>` : ''}
    <div class="px-4 py-1.5 text-[11px] text-slate-500 bg-slate-900">${f.pdf ? 'If the PDF stays blank on a phone, use Open in new tab.' : 'Use zoom and rotate to read fine print.'}</div>`;
  applyImg();
}
function applyImg(){ const i=$('#vim'); if(i) i.style.transform=`scale(${z}) rotate(${rot}deg)`; }
function zoom(d){ z = d===0 ? 1 : Math.min(4, Math.max(.5, z+d)); if(d===0) rot=0; applyImg(); }
function turn(){ rot=(rot+90)%360; applyImg(); }

/* ----- prescribe (one request per medicine, matching the existing /prescribe API) ----- */
function paneRx(){
  const al = list(S.patient.allergies), doc = localStorage.getItem('doctorName') || '';
  $('#pane').innerHTML = `
  <div class="${card} border-teal-500/40 max-w-3xl space-y-4">
    <div class="flex items-center justify-between border-b border-slate-800 pb-3"><h2 class="font-extrabold text-teal-400">Prescription for ${esc(S.patient.name||'patient')}</h2><span class="text-xs text-slate-500">Sent to the patient's phone</span></div>
    <div><label for="dn" class="${lbl}">Doctor name and qualification</label><input id="dn" class="${inp}" value="${esc(doc)}" placeholder="Dr. Full Name (MD)" oninput="try{localStorage.setItem('doctorName',this.value)}catch(e){}"></div>
    <div id="meds" class="space-y-3"></div>
    <div id="warn"></div>
    <button type="button" class="${btn2}" onclick="rows.push(blank());drawRows()">Add another medicine</button>
    <button id="pbtn" class="${btn} w-full py-3 uppercase tracking-wider" onclick="issue()">Issue prescription to patient</button>
    ${al.length?'':''}
  </div>`;
  drawRows();
}
function drawRows(){
  $('#meds').innerHTML = rows.map((m,i)=>`<div class="bg-slate-900/60 border border-slate-800 rounded-xl p-3 space-y-2 relative">
    ${rows.length>1?`<button onclick="rows.splice(${i},1);drawRows()" class="absolute top-2 right-3 text-slate-500 hover:text-slate-200 text-lg" aria-label="Remove medicine">&times;</button>`:''}
    <div><label class="${lbl}">Medicine name and strength</label><input class="${inp}" value="${esc(m.n)}" placeholder="e.g. Paracetamol 500 mg" oninput="rows[${i}].n=this.value;warn()"></div>
    <div class="grid sm:grid-cols-2 gap-3">
      <div><label class="${lbl}">Dosage</label><input class="${inp}" value="${esc(m.dose)}" oninput="rows[${i}].dose=this.value"></div>
      <div><label class="${lbl}">Timing</label><select class="${inp}" onchange="rows[${i}].t=this.value">${TIMES.map(t=>`<option${t===m.t?' selected':''}>${t}</option>`).join('')}</select></div></div>
    <div><label class="${lbl}">Advice and instructions</label><input class="${inp}" value="${esc(m.ins)}" placeholder="e.g. Twice daily after food for 5 days" oninput="rows[${i}].ins=this.value"></div></div>`).join('');
  warn();
}
function warn(){
  const al = list(S.patient.allergies), hit = [];
  rows.forEach(m => al.forEach(a => { const w=a.toLowerCase().split(' ')[0]; if(w && m.n.toLowerCase().includes(w)) hit.push(`${m.n} (allergy: ${a})`); }));
  $('#warn').innerHTML = hit.length ? `<div class="bg-rose-950/70 border border-rose-800 text-rose-200 rounded-xl p-3 text-sm"><b>Allergy alert:</b> ${hit.map(esc).join(', ')}
    <label class="flex items-center gap-2 mt-2 text-xs"><input type="checkbox" ${ack?'checked':''} onchange="ack=this.checked" class="accent-teal-500"> I have reviewed this alert and want to proceed</label></div>` : '';
  warn.hit = hit.length;
}
async function issue(){
  const doc = $('#dn').value.trim(), good = rows.filter(m=>m.n.trim());
  if(!doc){ toast('Enter your name and qualification.'); $('#dn').focus(); return; }
  if(!good.length){ toast('Add at least one medicine.'); return; }
  if(warn.hit && !ack){ toast('Confirm the allergy alert first.'); return; }
  const b = $('#pbtn'); b.disabled = true; b.textContent = 'Sending to patient account...'; setStatus('wait');
  const failed = [];
  for(const m of good){
    try{
      const r = await fetch(`${API_BASE}/prescribe`, { method:'POST', headers:{'Content-Type':'application/json'},
        body:JSON.stringify({ patientId:S.patient.id || 'fam_2', medicineName:m.n.trim(), dosage:m.dose.trim(), timing:m.t, instructions:m.ins.trim(), doctorName:doc }) });
      const d = await r.json();
      if(d.success && d.prescription){ S.medicines.unshift(d.prescription); issued.unshift({ ...d.prescription, at:new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}), doc }); setStatus('ok'); }
      else failed.push(m);
    }catch(e){ setStatus('bad'); failed.push(m); }
  }
  if(failed.length){ rows = failed; ack=false; toast(`${good.length-failed.length} sent, ${failed.length} failed. Failed medicines are still listed so you can retry.`); paneRx(); }
  else { rows=[blank()]; ack=false; toast('Prescription sent to the patient\'s phone.'); go('issued'); }
}
function paneIssued(){
  $('#pane').innerHTML = `<div class="${card} max-w-3xl"><h3 class="font-bold mb-3">Issued this session</h3><div class="space-y-2">
    ${issued.length ? issued.map(m=>medRow(m,true).replace('>New<',`>${esc(m.at)}<`)).join('') : '<p class="text-sm text-slate-500">Nothing issued yet in this session.</p>'}</div></div>`;
}

render();
</script>
</body>
</html>
